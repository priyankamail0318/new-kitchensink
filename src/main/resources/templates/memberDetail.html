<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kitchen Sink Application</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Member Details</h1>
    <div class="card">
        <div class="card-header">
            <h2 th:text="${member.name}">Member Name</h2>
        </div>
        <div class="card-body">
            <h5 class="card-title">Email:</h5>
            <p class="card-text" th:text="${member.email}"></p>

            <h5 class="card-title">Phone Number:</h5>
            <p class="card-text" th:text="${member.phoneNumber}"></p>

            <a th:href="@{/index.html}" class="btn btn-primary">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
